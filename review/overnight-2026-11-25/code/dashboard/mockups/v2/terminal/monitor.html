<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920">
<meta name="theme-color" content="#0a0c0a">
<title>SI Console terminal: monitor</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="screen" class="monitor"></div>
<script src="../shared/v2-data.js"></script>
<script src="render.js"></script>
<script>
(function () {
  var h = new URLSearchParams(location.hash.slice(1));
  var state = h.get("state") || "idle";
  var lang = h.get("lang") || "en";
  if (window.V2.STATES.indexOf(state) < 0) state = "idle";
  window.V2Render("monitor", state, lang);
})();
</script>
</body>
</html>
