<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920">
<title>SI Console monitor: heatmap</title>
<link rel="stylesheet" href="./style.css">
</head>
<body class="monitor">
<div id="screen"></div>
<script src="../shared/v2-data.js"></script>
<script src="./render.js"></script>
<script>
(function () {
  var h = location.hash.replace(/^#/, "");
  var q = {};
  h.split("&").forEach(function (p) {
    var kv = p.split("=");
    if (kv[0]) q[kv[0]] = decodeURIComponent(kv[1] || "");
  });
  var state = (window.V2 && window.V2.STATES.indexOf(q.state) >= 0) ? q.state : "idle";
  var lang = q.lang === "zh" ? "zh" : "en";
  window.V2Render("monitor", state, lang);
})();
</script>
</body>
</html>
