<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=800">
<meta name="theme-color" content="#0d1117">
<title>SI Console mission mini</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="screen"></div>
<script src="../shared/v2-data.js"></script>
<script src="./render.js"></script>
<script>
(function () {
  var hash = (location.hash || "").replace(/^#/, "");
  var params = {};
  hash.split("&").forEach(function (p) {
    var kv = p.split("=");
    if (kv[0]) params[kv[0]] = decodeURIComponent(kv[1] || "");
  });
  window.V2Render("mini", params.state || "idle", params.lang || "en");
})();
</script>
</body>
</html>
