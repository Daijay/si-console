<text x="20" y="28" font-family="monospace" font-size="24" fill="#fff" font-weight="bold">SI CONSOLE</text>
<text x="20" y="52" font-family="monospace" font-size="14" fill="#fff">CONNECTION DIAGRAM</text>
<text x="1180" y="28" font-family="monospace" font-size="13" fill="#fff">REV R3  |  DATE 2026-11-23</text>
<text x="20" y="92" font-family="monospace" font-size="13" fill="#000">Pi 5 in the middle. Every line says how it connects. Prices in CAD. Full parts table in SI_Console_Overview.md.</text>
