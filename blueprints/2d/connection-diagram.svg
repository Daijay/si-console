<g font-family="monospace" font-size="12" fill="#000">
<text x="445" y="192">micro HDMI, HDMI0</text>
<text x="710" y="240">adapter + HDMI cable</text>
<text x="450" y="470">micro HDMI, HDMI1</text>
<text x="450" y="490">adapter + HDMI cable</text>
<text x="910" y="300">USB-A, Pi USB</text>
<text x="445" y="552">GPIO17/27/22/23/24</text>
<text x="445" y="570">GND, active low</text>
<text x="1030" y="420">USB-A, Pi USB</text>
<text x="1030" y="600">5V + GND, 140 mA</text>
<text x="1010" y="690">USB-C, 27W, wall</text>
<text x="440" y="732">GPIO5/6/13/19/20/21, 5V</text>
